spring:
  application:
    name: consumption-service
  datasource:
    url: jdbc:postgresql://localhost:5432/consumo
    username: energia
    password: energia
  jpa:
    hibernate:
      ddl-auto: validate   # el esquema lo crea Flyway; Hibernate solo lo comprueba
    open-in-view: false
  kafka:
    bootstrap-servers: localhost:9092
    consumer:
      group-id: consumption-service
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      # Envuelve al deserializador JSON: un mensaje corrupto va al DLT en vez de atascar
      value-deserializer: org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
      properties:
        spring.deserializer.value.delegate.class: org.springframework.kafka.support.serializer.JacksonJsonDeserializer
        spring.json.value.default.type: com.energia.consumption.kafka.LecturaMedidor
        spring.json.use.type.headers: false
        spring.json.trusted.packages: com.energia.consumption.kafka
    producer:   # para publicar en el dead letter topic
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JacksonJsonSerializer
      properties:
        spring.json.add.type.headers: false

server:
  port: 8081

# Dónde está tariff-service. En Docker o Kubernetes se cambia con la
# variable de entorno TARIFAS_URL, sin tocar el código.
tarifas:
  url: http://localhost:8083